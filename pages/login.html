<div class="max-w-md mx-auto space-y-6 py-2">
  <!-- Header Login -->
  <div class="text-center space-y-2">
    <div
      class="w-14 h-14 bg-sky-100 text-sky-600 rounded-3xl flex items-center justify-center mx-auto text-2xl font-bold shadow-sm"
    >
      🔐
    </div>
    <h2 class="text-2xl font-black text-slate-800 tracking-tight">
      Masuk Akun
    </h2>
    <p class="text-xs font-semibold text-slate-400">
      Ambalan Rama Sinta SMAN 3 Singaraja
    </p>
  </div>

  <!-- Form Login -->
  <div
    class="bg-white p-6 rounded-3xl border border-slate-100 shadow-xl shadow-slate-100/50"
  >
    <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
      <!-- Field Username / ID / HP -->
      <div>
        <label
          for="login_username"
          class="block font-bold text-slate-500 uppercase text-[10px] tracking-wider mb-1.5"
        >
          ID Anggota / No HP / Admin
        </label>
        <div class="relative">
          <input
            type="text"
            id="login_username"
            name="username"
            required
            placeholder="No Hp / ID"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 font-bold text-slate-800 placeholder-slate-400 transition-all duration-200"
          />
        </div>
      </div>

      <!-- Field Password -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label
            for="login_password"
            class="block font-bold text-slate-500 uppercase text-[10px] tracking-wider"
          >
            Password
          </label>
          <span class="text-[9px] font-bold text-slate-400"
            >Default: No HP / ID</span
          >
        </div>
        <div class="relative">
          <input
            type="password"
            id="login_password"
            name="password"
            placeholder="No Hp / ID"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 font-bold text-slate-800 placeholder-slate-400 transition-all duration-200"
          />
        </div>
      </div>

      <!-- Tombol Submit -->
      <button
        type="submit"
        id="btn_submit_login"
        class="w-full py-4 mt-2 bg-gradient-to-r from-sky-600 to-blue-600 text-white font-black text-xs rounded-2xl shadow-lg shadow-sky-600/25 hover:shadow-sky-600/40 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2"
      >
        <span>MASUK SEKARANG</span>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>
    </form>
  </div>

  <!-- Footer Link Registrasi -->
  <div class="text-center">
    <p class="text-xs font-semibold text-slate-500">
      Belum terdaftar sebagai anggota?
      <button
        onclick="navigateTo('register')"
        class="text-sky-600 font-extrabold hover:underline ml-1 focus:outline-none"
      >
        Daftar Sekarang
      </button>
    </p>
  </div>
</div>
