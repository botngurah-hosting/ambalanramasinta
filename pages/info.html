<div class="p-4 space-y-4 min-h-full bg-slate-50 pb-8">
  <!-- HEADER HALAMAN -->
  <div
    class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 shadow-xs"
  >
    <div class="flex items-center space-x-3">
      <button
        type="button"
        onclick="navigateTo('home')"
        class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-all font-bold"
      >
        ←
      </button>
      <div>
        <h2
          class="text-xs font-extrabold text-slate-800 uppercase tracking-wide"
        >
          Informasi & Statistik
        </h2>
        <p class="text-[10px] text-slate-400">
          Dashboard Data Ambalan Rama Sinta
        </p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button
        onclick="fetchInfoStats()"
        title="Muat Ulang Data"
        class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 hover:bg-sky-100 flex items-center justify-center text-xs font-bold transition-all"
      >
        🔄
      </button>
      <span class="text-lg">📊</span>
    </div>
  </div>

  <!-- STATE LOADING -->
  <div
    id="info_loading"
    class="flex flex-col items-center justify-center py-16 space-y-3 bg-white rounded-3xl border border-slate-100 shadow-xs"
  >
    <div
      class="w-8 h-8 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"
    ></div>
    <p class="text-xs font-bold text-slate-400">Memuat statistik data...</p>
  </div>

  <!-- KONTEN STATISTIK (DITAMPILKAN SETELAH DATA DIMUAT) -->
  <div id="info_content" class="hidden space-y-4">
    <!-- RINGKASAN UTAMA (KPI CARDS) -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Total Pendaftar -->
      <div
        class="bg-gradient-to-br from-sky-600 to-blue-700 text-white p-4 rounded-3xl shadow-md shadow-sky-600/20 relative overflow-hidden"
      >
        <div class="relative z-10">
          <span
            class="text-[10px] font-extrabold text-sky-200 uppercase tracking-wider block mb-1"
          >
            Total Terdaftar
          </span>
          <span id="stat_total_daftar" class="text-3xl font-black">0</span>
          <span class="text-xs font-bold text-sky-100 ml-1">Anggota</span>
        </div>
        <span class="absolute -right-2 -bottom-2 text-5xl opacity-20">👥</span>
      </div>

      <!-- Total Pemesan Baju -->
      <div
        class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-4 rounded-3xl shadow-md shadow-amber-500/20 relative overflow-hidden"
      >
        <div class="relative z-10">
          <span
            class="text-[10px] font-extrabold text-amber-100 uppercase tracking-wider block mb-1"
          >
            Pesan Jersey
          </span>
          <span id="stat_total_baju" class="text-3xl font-black">0</span>
          <span class="text-xs font-bold text-amber-100 ml-1">Pcs</span>
        </div>
        <span class="absolute -right-2 -bottom-2 text-5xl opacity-20">👕</span>
      </div>
    </div>

    <!-- STATISTIK PER ANGKATAN -->
    <div
      class="bg-white p-5 rounded-3xl border border-slate-100 shadow-xs space-y-3"
    >
      <div
        class="flex items-center justify-between border-b border-slate-100 pb-2"
      >
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-wide">
          Anggota Per Angkatan
        </h3>
        <span
          class="text-[10px] font-extrabold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full"
        >
          Klik untuk lihat anggota
        </span>
      </div>
      <div id="container_angkatan" class="space-y-2.5 pt-1">
        <!-- Generasi Baris Angkatan via JS -->
      </div>
    </div>

    <!-- STATISTIK UKURAN BAJU -->
    <div
      class="bg-white p-5 rounded-3xl border border-slate-100 shadow-xs space-y-3"
    >
      <div
        class="flex items-center justify-between border-b border-slate-100 pb-2"
      >
        <h3 class="text-xs font-black text-slate-800 uppercase tracking-wide">
          Rincian Ukuran Jersey
        </h3>
        <span
          class="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full"
        >
          S, M, L, XL, XXL
        </span>
      </div>
      <div
        id="container_ukuran"
        class="grid grid-cols-5 gap-1.5 pt-1 text-center"
      >
        <!-- Generasi Box Ukuran via JS -->
      </div>
    </div>
  </div>
</div>

<!-- MODAL ANGGOTA PER ANGKATAN -->
<div
  id="membersModal"
  class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all"
>
  <div
    class="bg-white w-full max-w-sm rounded-3xl shadow-2xl border border-slate-100 overflow-hidden flex flex-col max-h-[80vh] animate-in fade-in zoom-in-95 duration-200"
  >
    <!-- Modal Header -->
    <div
      class="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between"
    >
      <div>
        <h3
          id="modal_angkatan_title"
          class="text-xs font-black text-slate-800 uppercase tracking-wide"
        >
          Daftar Anggota
        </h3>
        <p id="modal_angkatan_subtitle" class="text-[10px] text-slate-400">
          Ambalan Rama Sinta
        </p>
      </div>
      <button
        type="button"
        onclick="closeMembersModal()"
        class="w-8 h-8 rounded-xl bg-slate-200/60 hover:bg-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center transition-all"
      >
        ✕
      </button>
    </div>

    <!-- Modal Body (List Anggota) -->
    <div id="modal_members_list" class="p-4 overflow-y-auto space-y-3 flex-1">
      <!-- Item Anggota akan di-generate oleh JavaScript -->
    </div>
  </div>
</div>
