<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambalan Rama Sinta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col justify-between"
  >
    <!-- 1. HEADER UTAMA (Tombol Dashboard diletakkan di sini) -->
    <header class="bg-sky-700 text-white shadow-md sticky top-0 z-40">
      <div
        class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between"
      >
        <div class="flex items-center space-x-2">
          <div
            class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-sky-700 font-black text-xs shadow"
          >
            ARS
          </div>
          <span class="font-bold text-sm tracking-wide"
            >Ambalan Rama Sinta</span
          >
        </div>

        <!-- AREA AKSI HEADER (Dashboard & Keluar) -->
        <div class="flex items-center space-x-2">
          <!-- Tombol / Ikon Dashboard -->
          <button
            onclick="navigateTo('admin')"
            id="btn-dashboard"
            class="hidden text-xs bg-sky-600 hover:bg-sky-800 px-3 py-1.5 rounded-lg font-semibold transition cursor-pointer flex items-center gap-1.5"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              />
            </svg>
            <span>Dashboard</span>
          </button>

          <!-- Tombol Keluar / Logout -->
          <button
            onclick="logout()"
            id="btn-logout"
            class="hidden text-xs bg-sky-800 hover:bg-sky-900 px-3 py-1.5 rounded-lg font-semibold transition cursor-pointer"
          >
            Keluar
          </button>
        </div>
      </div>
    </header>

    <!-- 2. WADAH KONTEN DINAMIS -->
    <main
      class="max-w-7xl mx-auto w-full flex-1 px-3 sm:px-6 lg:px-8 py-4 pb-24"
    >
      <!-- Indicator Loading -->
      <div id="loading-spinner" class="hidden my-8 text-center">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-sky-600 border-t-transparent"
        ></div>
        <p id="loading-text" class="text-xs text-slate-500 font-semibold mt-2">
          Memuat halaman...
        </p>
      </div>

      <!-- Container Utama tempat HTML parsial di-render -->
      <div id="app-container" class="w-full"></div>
    </main>

    <!-- 3. BOTTOM NAVIGATION (Kembali seperti semula) -->
    <nav
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40"
    >
      <div
        class="max-w-md sm:max-w-lg mx-auto flex justify-around items-center py-2 text-slate-500 text-[10px] font-bold"
      >
        <!-- Tombol Home -->
        <button
          onclick="navigateTo('home')"
          class="flex flex-col items-center space-y-1 hover:text-sky-600 transition cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            />
          </svg>
          <span>Beranda</span>
        </button>

        <!-- Tombol Pendaftaran -->
        <button
          onclick="navigateTo('register')"
          class="flex flex-col items-center space-y-1 hover:text-sky-600 transition cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
            />
          </svg>
          <span>Daftar</span>
        </button>

        <!-- Tombol Profil / User -->
        <button
          onclick="navigateTo('user')"
          class="flex flex-col items-center space-y-1 hover:text-sky-600 transition cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          <span>Profil</span>
        </button>

        <!-- Tombol Login / Admin -->
        <button
          onclick="navigateTo('login')"
          class="flex flex-col items-center space-y-1 hover:text-sky-600 transition cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
            />
          </svg>
          <span>Masuk</span>
        </button>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/router.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
    <script src="js/user.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
